name: CI
permissions:
  contents: read
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for packaging errors
        uses: kirkeaton/action-publint@dccf80070e12f4d922a7e59c6a6cb26dcb2cec46 # v2.1.10
